<svg width="1600" height="118" viewBox="0 0 1600 118" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<title>Tech Stack</title>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05060B"/>
      <stop offset="55%" stop-color="#0A0E1A"/>
      <stop offset="100%" stop-color="#0B0915"/>
    </linearGradient>

    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="45%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#C026D3"/>
    </linearGradient>

    <linearGradient id="brandGradSoft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C026D3" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141B30"/>
      <stop offset="100%" stop-color="#0D1220"/>
    </linearGradient>

    <linearGradient id="edgeFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C026D3" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowMagenta" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C026D3" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#C026D3" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dotGrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#7C3AED" opacity="0.16"/>
    </pattern>

    <pattern id="circuitTex" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M0 60 H40 V20 H90" stroke="#7C3AED" stroke-opacity="0.10" stroke-width="1.4" fill="none"/>
      <path d="M120 30 H80 V90 H30" stroke="#22D3EE" stroke-opacity="0.08" stroke-width="1.4" fill="none"/>
      <circle cx="40" cy="20" r="2.4" fill="#7C3AED" opacity="0.18"/>
      <circle cx="90" cy="20" r="2.4" fill="#7C3AED" opacity="0.12"/>
      <circle cx="80" cy="90" r="2.4" fill="#22D3EE" opacity="0.16"/>
      <circle cx="30" cy="90" r="2.4" fill="#22D3EE" opacity="0.10"/>
    </pattern>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    
  </defs>

  <rect width="1600" height="118" fill="url(#bgGrad)"/>
  <rect width="1600" height="118" fill="url(#circuitTex)"/>
  <rect width="1600" height="118" fill="url(#dotGrid)"/><ellipse cx="120" cy="59.0" rx="260" ry="140" fill="url(#glowViolet)" opacity="0.8"/><rect x="0" y="0" width="6" height="118" fill="url(#brandGrad)"/><rect x="44" y="32.0" width="54" height="54" rx="14" fill="url(#panelGrad)" stroke="#241C3D" stroke-width="1.3"/><text x="71" y="68.0" text-anchor="middle" font-family="'SFMono-Regular','Cascadia Code','Consolas','Liberation Mono',Menlo,monospace" font-size="20" font-weight="700" fill="#22D3EE">02</text><g transform="translate(122,43.0) scale(1.333)" fill="none" stroke="#9333EA" stroke-width="1.28" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></g><text x="172" y="71.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="34" font-weight="800" fill="#F4F2FF">Tech Stack</text><line x1="384.15999999999997" y1="59.0" x2="1540.0" y2="59.0" stroke="url(#edgeFade)" stroke-width="1.4" opacity="0.8"/><circle cx="1530" cy="59.0" r="4" fill="#C026D3" opacity="0.8"/><circle cx="1530" cy="59.0" r="9" fill="none" stroke="#C026D3" stroke-width="1.2" opacity="0.4"><animate attributeName="r" values="9;16;9" dur="2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0;0.5" dur="2.6s" repeatCount="indefinite"/></circle>
</svg>