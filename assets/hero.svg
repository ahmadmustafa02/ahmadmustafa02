<svg xmlns="http://www.w3.org/2000/svg" width="720" height="248" viewBox="0 0 720 248" role="img">
  <title>Ahmad Mustafa, full-stack AI engineer and security researcher</title>
  <defs>
    <clipPath id="card">
      <rect width="720" height="248" rx="18"/>
    </clipPath>
    <linearGradient id="bar" x1="0" y1="0" x2="720" y2="0">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.42" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="1" cy="0" r="0.85">
      <stop stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0" cy="1" r="0.7">
      <stop stop-color="#7C3AED" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#FFFFFF" fill-opacity="0.14"/>
    </pattern>
  </defs>
  <g clip-path="url(#card)">
    <rect width="720" height="248" fill="#0C1017"/>
    <rect width="720" height="248" fill="url(#glowCyan)"/>
    <rect width="720" height="248" fill="url(#glowViolet)"/>
    <rect width="720" height="248" fill="url(#dots)"/>
    <rect width="720" height="3" fill="url(#bar)"/>
    <circle cx="640" cy="42" r="78" fill="none" stroke="#22D3EE" stroke-opacity="0.18"/>
    <circle cx="640" cy="42" r="50" fill="none" stroke="#A78BFA" stroke-opacity="0.28"/>
    <rect x="36" y="48" width="68" height="68" rx="16" fill="#121826" stroke="#22D3EE" stroke-width="1.5"/>
    <text x="70" y="90" text-anchor="middle" fill="#22D3EE" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700">AM</text>
    <text x="124" y="66" fill="#22D3EE" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="2.4">FULL-STACK AI ENGINEER</text>
    <text x="124" y="108" fill="#F6F4FF" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" font-weight="600" letter-spacing="-0.8">Ahmad Mustafa</text>
    <text x="124" y="142" fill="#B7B3C9" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16">Security researcher. Agents, RAG, and authorization.</text>
    <line x1="124" y1="168" x2="520" y2="168" stroke="#2A3142" stroke-width="1"/>
    <circle cx="130" cy="198" r="4" fill="#22D3EE"/>
    <text x="144" y="203" fill="#D5D2E4" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14">Islamabad</text>
    <circle cx="250" cy="198" r="4" fill="#A78BFA"/>
    <text x="264" y="203" fill="#D5D2E4" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14">COMSATS, 2027</text>
    <circle cx="410" cy="198" r="4" fill="#C026D3"/>
    <text x="424" y="203" fill="#D5D2E4" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14">Placentek</text>
  </g>
  <rect x="0.5" y="0.5" width="719" height="247" rx="18" fill="none" stroke="#232838"/>
</svg>
