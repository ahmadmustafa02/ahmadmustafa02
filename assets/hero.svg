<svg xmlns="http://www.w3.org/2000/svg" width="960" height="136" viewBox="0 0 960 136" role="img">
  <title>Ahmad Mustafa, full-stack AI engineer</title>
  <defs>
    <clipPath id="card">
      <rect width="960" height="136" rx="16"/>
    </clipPath>
    <linearGradient id="bar" x1="0" y1="0" x2="960" y2="0">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.4" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="1" cy="0" r="0.8">
      <stop stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#card)">
    <rect width="960" height="136" fill="#0C1017"/>
    <rect width="960" height="136" fill="url(#glowCyan)"/>
    <rect width="960" height="3" fill="url(#bar)"/>
    <rect x="28" y="36" width="64" height="64" rx="14" fill="#121826" stroke="#22D3EE" stroke-width="1.5"/>
    <text x="60" y="75" text-anchor="middle" fill="#22D3EE" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700">AM</text>
    <text x="112" y="50" fill="#22D3EE" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2.2">FULL-STACK AI ENGINEER</text>
    <text x="112" y="82" fill="#F6F4FF" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="600" letter-spacing="-0.6">Ahmad Mustafa</text>
    <text x="112" y="108" fill="#B7B3C9" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15">Agents, RAG, and authorization.</text>
    <circle cx="690" cy="46" r="3.5" fill="#22D3EE"/>
    <text x="704" y="51" fill="#D5D2E4" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14">Islamabad</text>
    <circle cx="690" cy="72" r="3.5" fill="#A78BFA"/>
    <text x="704" y="77" fill="#D5D2E4" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14">COMSATS, 2027</text>
    <circle cx="690" cy="98" r="3.5" fill="#C026D3"/>
    <text x="704" y="103" fill="#D5D2E4" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14">Placentek</text>
  </g>
  <rect x="0.5" y="0.5" width="959" height="135" rx="16" fill="none" stroke="#232838"/>
</svg>
