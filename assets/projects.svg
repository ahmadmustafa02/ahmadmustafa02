<svg width="1600" height="585" viewBox="0 0 1600 585" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<title>Featured projects</title>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05060B"/>
      <stop offset="55%" stop-color="#0A0E1A"/>
      <stop offset="100%" stop-color="#0B0915"/>
    </linearGradient>

    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="45%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#C026D3"/>
    </linearGradient>

    <linearGradient id="brandGradSoft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C026D3" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141B30"/>
      <stop offset="100%" stop-color="#0D1220"/>
    </linearGradient>

    <linearGradient id="edgeFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C026D3" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowMagenta" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C026D3" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#C026D3" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dotGrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#7C3AED" opacity="0.16"/>
    </pattern>

    <pattern id="circuitTex" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M0 60 H40 V20 H90" stroke="#7C3AED" stroke-opacity="0.10" stroke-width="1.4" fill="none"/>
      <path d="M120 30 H80 V90 H30" stroke="#22D3EE" stroke-opacity="0.08" stroke-width="1.4" fill="none"/>
      <circle cx="40" cy="20" r="2.4" fill="#7C3AED" opacity="0.18"/>
      <circle cx="90" cy="20" r="2.4" fill="#7C3AED" opacity="0.12"/>
      <circle cx="80" cy="90" r="2.4" fill="#22D3EE" opacity="0.16"/>
      <circle cx="30" cy="90" r="2.4" fill="#22D3EE" opacity="0.10"/>
    </pattern>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    
  </defs>

