es,</text><text x="68" y="233" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="25" fill="#E8E4F8">then enforcing strict controls over its authorized</text><text x="68" y="256" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="25" fill="#E8E4F8">actions.</text><rect x="68" y="289" width="692.0" height="120" rx="12" fill="#C026D3" fill-opacity="0.08" stroke="#C026D3" stroke-opacity="0.4" stroke-width="1.1"/><text x="86" y="323" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="28" font-weight="800" fill="#C026D3">60/60</text><text x="178.1" y="309" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="28" font-weight="600" fill="#E8E4F8">attacks stopped with the guard active, vs</text><text x="178.1" y="327" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="28" font-weight="600" fill="#E8E4F8">17/60 hijacked with it off</text><text x="86" y="359" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="24" fill="#B9B4D6">15/15 held out on an attack set never used to</text><text x="86" y="377" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="24" fill="#B9B4D6">tune the rules</text><g><rect x="68.0" y="435.0" width="92.0" height="28" rx="14.0" fill="#C026D3" fill-opacity="0.1" stroke="#C026D3" stroke-opacity="0.55" stroke-width="1.1"/><text x="114.0" y="453.6" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="28" font-weight="600" fill="#E8E4F8">TypeScript</text></g><g><rect x="168.0" y="435.0" width="70.7" height="28" rx="14.0" fill="#C026D3" fill-opacity="0.1" stroke="#C026D3" stroke-opacity="0.55" stroke-width="1.1"/><text x="203.3" y="453.6" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="28" font-weight="600" fill="#E8E4F8">Groq AI</text></g><g><rect x="246.7" y="435.0" width="84.9" height="28" rx="14.0" fill="#C026D3" fill-opacity="0.1" stroke="#C026D3" stroke-opacity="0.55" stroke-width="1.1"/><text x="289.1" y="453.6" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="28" font-weight="600" fill="#E8E4F8">CLI Proxy</text></g><g><rect x="339.5" y="435.0" width="113.7" height="28" rx="14.0" fill="#C026D3" fill-opacity="0.1" stroke="#C026D3" stroke-opacity="0.55" stroke-width="1.1"/><text x="396.4" y="453.6" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="28" font-weight="600" fill="#E8E4F8">npm packages</text></g><rect x="812.0" y="30" width="748.0" height="60" rx="18" fill="#141B30"/><rect x="812.0" y="60.0" width="748.0" height="30.0" fill="#141B30"/><circle cx="838.0" cy="60.0" r="5.5" fill="#C026D3" opacity="0.85"/><circle cx="856.0" cy="60.0" r="5.5" fill="#FBBF24" opacity="0.85"/><circle cx="874.0" cy="60.0" r="5.5" fill="#34D399" opacity="0.85"/><text x="1186.0" y="65.0" text-anchor="middle" font-family="'SFMono-Regular','Cascadia Code','Consolas','Liberation Mono',Menlo,monospace" font-size="24" fill="#B9B4D6">~/codepulse</text><rect x="812.0" y="90" width="748.0" height="449" rx="18" ry="18" fill="url(#panelGrad)" stroke="#241C3D" stroke-width="1.4" /><g transform="translate(840.0,114) scale(1.083)" fill="none" stroke="#22D3EE" stroke-width="1.66" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="3.5" width="19" height="17" rx="2.4"/><path d="M6.5 8.5 10.5 12l-4 3.5M12.5 15.5h5"/></g><text x="876.0" y="134" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="27" font-weight="800" fill="#F4F2FF">CodePulse</text><text x="1532.0" y="134" text-anchor="end" font-family="'SFMono-Regular','Cascadia Code','Consolas','Liberation Mono',Menlo,monospace" font-size="20" fill="#B9B4D6">Production-style · GitHub App</text><text x="840.0" y="164" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="25" fill="#E8E4F8">AI-powered GitHub App that reviews pull requests</text><text x="840.0" y="187" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="25" fill="#E8E4F8">through an event-driven pipeline, defends against</text><text x="840.0" y="210" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="25" fill="#E8E4F8">prompt-injection attacks, and tracks its own review</text><text x="840.0" y="233" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="25" fill="#E8E4F8">quality through a maintained evaluation harness.</text><rect x="840.0" y="266" width="692.0" height="120" rx="12" fill="#22D3EE" fill-opacity="0.08" stroke="#22D3EE" stroke-opacity="0.4" stroke-width="1.1"/><text x="858.0" y="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="28" font-weight="800" fill="#22D3EE">Async</text><text x="950.0" y="286" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="28" font-weight="600" fill="#E8E4F8">BullMQ/Redis pipeline with HMAC-verified</text><text x="950.0" y="304" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="28" font-weight="600" fill="#E8E4F8">webhooks and full multi-tenant isolation</text><text x="858.0" y="336" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="24" fill="#B9B4D6">pre-LLM injection classifier + a Trace Viewer</text><text x="858.0" y="354" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="24" fill="#B9B4D6">for step-by-step fault localization</text><g><rect x="840.0" y="412.0" width="60.0" height="28" rx="14.0" fill="#22D3EE" fill-opacity="0.1" stroke="#22D3EE" stroke-opacity="0.55" stroke-width="1.1"/><text x="870.0" y="430.6" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="28" font-weight="600" fill="#E8E4F8">React</text></g><g><rect x="908.0" y="412.0" width="92.0" height="28" rx="14.0" fill="#22D3EE" fill-opacity="0.1" stroke="#22D3EE" stroke-opacity="0.55" stroke-width="1.1"/><text x="954.0" y="430.6" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="28" font-weight="600" fill="#E8E4F8">TypeScript</text></g><g><rect x="1007.9" y="412.0" width="70.7" height="28" rx="14.0" fill="#22D3EE" fill-opacity="0.1" stroke="#22D3EE" stroke-opacity="0.55" stroke-width="1.1"/><text x="1043.3" y="430.6" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="28" font-weight="600" fill="#E8E4F8">Node.js</text></g><g><rect x="1086.6" y="412.0" width="92.0" height="28" rx="14.0" fill="#22D3EE" fill-opacity="0.1" stroke="#22D3EE" stroke-opacity="0.55" stroke-width="1.1"/><text x="1132.6" y="430.6" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="