,54) scale(1.500)" fill="none" stroke="#22D3EE" stroke-width="1.07" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.6c2.6-1 5.6-1 8 0v14.8c-2.4-1-5.4-1-8 0Z"/><path d="M20 4.6c-2.6-1-5.6-1-8 0v14.8c2.4-1 5.4-1 8 0Z"/></g><text x="374.0" y="128" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="40" font-weight="800" fill="#F4F2FF">17,727</text><text x="374.0" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" font-weight="600" fill="#B9B4D6">merged PRs studied</text><text x="374.0" y="180" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" fill="#7A7594">empirical dependency-risk research</text><rect x="374.0" y="190" width="236.0" height="3" rx="1.5" fill="#22D3EE" opacity="0.15"/><rect x="374.0" y="190" width="236.0" height="3" rx="1.5" fill="#22D3EE"><animate attributeName="width" values="0;236.0" dur="1.4s" begin="0.12s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/></rect><rect x="656.0" y="28" width="288.0" height="176" rx="20" ry="20" fill="url(#panelGrad)" stroke="#241C3D" stroke-width="1.4" /><rect x="656.0" y="28" width="288.0" height="4" rx="2" fill="#7C3AED" opacity="0.85"/><circle cx="700.0" cy="72" r="24" fill="#7C3AED" fill-opacity="0.12" stroke="#7C3AED" stroke-opacity="0.55" stroke-width="1.3"/><g transform="translate(682.0,54) scale(1.500)" fill="none" stroke="#7C3AED" stroke-width="1.07" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l2.8 2.8M16.2 16.2 19 19M19 5l-2.8 2.8M7.8 16.2 5 19"/></g><text x="682.0" y="128" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="40" font-weight="800" fill="#F4F2FF">35%</text><text x="682.0" y="158" font-family="-apple-system,BlinkMacSystemFont,'Sego