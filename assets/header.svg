<svg xmlns="http://www.w3.org/2000/svg" width="640" height="168" viewBox="0 0 640 168" role="img">
  <title>Ahmad Mustafa, full-stack AI engineer and security researcher</title>
  <defs>
    <clipPath id="card">
      <rect width="640" height="168" rx="16"/>
    </clipPath>
    <linearGradient id="bar" x1="0" y1="0" x2="640" y2="0">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.45" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="1" cy="0" r="0.9">
      <stop stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0" cy="1" r="0.8">
      <stop stop-color="#7C3AED" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#card)">
    <rect width="640" height="168" fill="#0C1017"/>
    <rect width="640" height="168" fill="url(#glowCyan)"/>
    <rect width="640" height="168" fill="url(#glowViolet)"/>
    <rect width="640" height="3" fill="url(#bar)"/>
    <text x="32" y="78" fill="#F6F4FF" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="42" font-weight="600" letter-spacing="-0.8">Ahmad Mustafa</text>
    <text x="32" y="118" fill="#A9A4C2" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18">Full-stack AI engineer &#183; Security researcher</text>
  </g>
  <rect x="0.5" y="0.5" width="639" height="167" rx="16" fill="none" stroke="#232838"/>
</svg>
