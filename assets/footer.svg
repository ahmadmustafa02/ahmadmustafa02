<svg width="1600" height="220" viewBox="0 0 1600 220" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<title>Footer</title>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05060B"/>
      <stop offset="55%" stop-color="#0A0E1A"/>
      <stop offset="100%" stop-color="#0B0915"/>
    </linearGradient>

    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="45%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#C026D3"/>
    </linearGradient>

    <linearGradient id="brandGradSoft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C026D3" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141B30"/>
      <stop offset="100%" stop-color="#0D1220"/>
    </linearGradient>

    <linearGradient id="edgeFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C026D3" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowMagenta" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C026D3" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#C026D3" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dotGrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#7C3AED" opacity="0.16"/>
    </pattern>

    <pattern id="circuitTex" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M0 60 H40 V20 H90" stroke="#7C3AED" stroke-opacity="0.10" stroke-width="1.4" fill="none"/>
      <path d="M120 30 H80 V90 H30" stroke="#22D3EE" stroke-opacity="0.08" stroke-width="1.4" fill="none"/>
      <circle cx="40" cy="20" r="2.4" fill="#7C3AED" opacity="0.18"/>
      <circle cx="90" cy="20" r="2.4" fill="#7C3AED" opacity="0.12"/>
      <circle cx="80" cy="90" r="2.4" fill="#22D3EE" opacity="0.16"/>
      <circle cx="30" cy="90" r="2.4" fill="#22D3EE" opacity="0.10"/>
    </pattern>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    
  </defs>

  <rect width="1600" height="220" fill="url(#bgGrad)"/>
  <rect width="1600" height="220" fill="url(#circuitTex)"/>
  <rect width="1600" height="220" fill="url(#dotGrid)"/><ellipse cx="800" cy="110" rx="900" ry="140" fill="url(#glowViolet)" opacity="0.35"/><ellipse cx="240" cy="40" rx="260" ry="120" fill="url(#glowCyan)" opacity="0.5"/><ellipse cx="1360" cy="180" rx="260" ry="120" fill="url(#glowMagenta)" opacity="0.5"/><rect x="0" y="0" width="1600" height="2" fill="url(#brandGrad)" opacity="0.7"/><circle cx="412.2" cy="111.6" r="2.0" fill="#A78BFA" opacity="0.5"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="4.9s" repeatCount="indefinite" begin="0.00s"/></circle><circle cx="157.0" cy="32.0" r="2.7" fill="#C026D3" opacity="0.5"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="4.7s" repeatCount="indefinite" begin="0.30s"/></circle><circle cx="343.8" cy="137.6" r="2.3" fill="#A78BFA" opacity="0.5"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="4.2s" repeatCount="indefinite" begin="0.60s"/></circle><circle cx="1334.3" cy="64.8" r="1.6" fill="#A78BFA" opacity="0.5"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="5.2s" repeatCount="indefinite" begin="0.90s"/></circle><circle cx="1053.7" cy="39.6" r="2.6" fill="#7C3AED" opacity="0.5"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="3.9s" repeatCount="indefinite" begin="1.20s"/></circle><circle cx="105.9" cy="159.8" r="2.2" fill="#A78BFA" opacity="0.5"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="5.1s" repeatCount="indefinite" begin="1.50s"/></circle><circle cx="1423.2" cy="89.2" r="2.7" fill="#A78BFA" opacity="0.5"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="5.9s" repeatCount="indefinite" begin="1.80s"/></circle><circle cx="258.5" cy="84.8" r="1.5" fill="#A78BFA" opacity="0.5"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="3.7s" repeatCount="indefinite" begin="2.10s"/></circle><circle cx="1488.9" cy="95.4" r="2.4" fill="#C026D3" opacity="0.5"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="4.3s" repeatCount="indefinite" begin="2.40s"/></circle><circle cx="1293.5" cy="116.1" r="2.3" fill="#A78BFA" opacity="0.5"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="4.8s" repeatCount="indefinite" begin="2.70s"/></circle><circle cx="1398.2" cy="132.3" r="2.9" fill="#C026D3" opacity="0.5"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="6.0s" repeatCount="indefinite" begin="3.00s"/></circle><circle cx="1053.5" cy="54.5" r="2.8" fill="#7C3AED" opacity="0.5"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="5.1s" repeatCount="indefinite" begin="3.30s"/></circle><circle cx="372.5" cy="154.7" r="2.3" fill="#C026D3" opacity="0.5"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="3.4s" repeatCount="indefinite" begin="3.60s"/></circle><circle cx="773.4" cy="125.8" r="2.2" fill="#C026D3" opacity="0.5"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="5.4s" repeatCount="indefinite" begin="3.90s"/></circle><text x="800.0" y="92" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="28" font-weight="800" fill="#F4F2FF">Thanks for stopping by.</text><text x="800.0" y="126" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#B9B4D6">Always open to talk about agent security, RAG systems, or the next hard bug.</text><text x="800.0" y="168" text-anchor="middle" font-family="'SFMono-Regular','Cascadia Code','Consolas','Liberation Mono',Menlo,monospace" font-size="13.5" fill="#7A7594">designed &amp; built by Ahmad Mustafa</text><rect x="0" y="218" width="1600" height="2" fill="url(#brandGrad)" opacity="0.7"/>
</svg>